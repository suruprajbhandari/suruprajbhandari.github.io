<html lang="en">
<head>
  <meta charset="UTF-8">

</head>

<body data-page="certificates">

  <!-- Navigation -->
  <nav class="nav" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="../" class="nav__mark" aria-label="Surup Rajbhandari — Home">
        <span class="nav__mark-ring"></span>
        <span class="nav__mark-text">SR</span>
      </a>

      <button class="nav__toggle" id="navToggle"
              aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>

      <div class="nav__links" id="navLinks">
        <a href="../"              data-page="home">Home</a>
        <a href="../about/"        data-page="about">About</a>
        <a href="../projects/"     data-page="projects">Projects</a>
        <a href="../certificates/" data-page="certificates">Certificates</a>
        <a href="../contact/"      data-page="contact">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="page-main page-enter">

    <!-- Page hero -->
    <header class="page-hero">
      <p class="page-hero__eyebrow">Credentials</p>
      <h1 class="page-hero__title">Certificates</h1>
      <p class="page-hero__sub">Genuine credentials I've earned. Click any entry to view the original document.</p>
    </header>

    <!-- Certificates rendered from data below -->
    <section aria-label="Certificate list">
      <p class="certs-intro">
        Only certificates I actually hold are listed here. Each links to the original document.
      </p>
      <div class="certs-grid reveal-stagger" id="certsGrid">
        <!-- Cards are rendered by the script below -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy">&copy; <span id="year"></span> Surup Rajbhandari</p>
      <nav class="footer__links" aria-label="Footer links">
        <a href="https://www.linkedin.com/in/surup-rajbhandari" target="_blank" rel="noreferrer noopener">LinkedIn</a>
        <a href="https://github.com/suruprajbhandari"           target="_blank" rel="noreferrer noopener">GitHub</a>
        <a href="../contact/">Contact</a>
      </nav>
    </div>
  </footer>

  <!-- ============================================================
       CERTIFICATE DATA
       To add a new certificate, copy one object below and fill it in.
       Fields:
         title      — certificate name (string)
         issuer     — issuing organisation (string)
         year       — year awarded (string)
         type       — "physical" | "digital"
         detailPage — path to the detail HTML page (string) or null
       ============================================================ -->
  <script>
  const CERTIFICATES = [
    {
      title: "SEP",
      issuer: "ING Skill Academy",
      year: "2024",
      type: "physical",
      detailPage: "../certs/sep.html"
    }
    // Add more certificates here as you earn them
  ];


  /* ----- Renderer ----- */
  (function renderCerts() {
    const grid = document.getElementById('certsGrid');
    if (!grid || !CERTIFICATES.length) return;

    CERTIFICATES.forEach(c => {
      const badgeCls   = c.type === 'digital' ? 'cert-badge--digital' : 'cert-badge--physical';
      const badgeLabel = c.type === 'digital' ? 'Digital' : 'Physical';

      const actionHtml = c.detailPage
        ? `<a href="${c.detailPage}" class="cert-card__link"
              aria-label="View ${c.title} certificate">
             View credential &rarr;
           </a>`
        : `<span class="cert-card__link" style="opacity:0.4;pointer-events:none;">
             Document pending
           </span>`;

      const article = document.createElement('article');
      article.className = 'card cert-card';
      article.innerHTML = `
        <div class="cert-card__top">
          <div class="cert-seal" aria-hidden="true">&#10003;</div>
          <div>
            <h2 class="cert-card__title">${c.title}</h2>
            <p class="cert-card__meta">${c.issuer} &middot; ${c.year}</p>
          </div>
        </div>
        <div class="cert-card__badges">
          <span class="cert-badge ${badgeCls}">${badgeLabel}</span>
          <span class="cert-badge" style="background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-secondary);">Verifiable</span>
        </div>
        <div class="cert-card__action">${actionHtml}</div>
      `;

      grid.appendChild(article);
    });
  })();
  </script>

  <script src="../script.js"></script>
</body>
</html>
