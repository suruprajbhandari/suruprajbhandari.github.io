<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate — Surup Rajbhandari</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .cert-page { max-width: 640px; margin: 0 auto; padding: 4rem 2rem; }
  .back-link { display: inline-block; margin-bottom: 2rem; color: var(--muted); font-size: 0.88rem; }
  .back-link:hover { color: var(--violet); }
  .cert-frame {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    padding: 1rem;
    margin: 1.5rem 0 2rem;
  }
  .cert-frame img { width: 100%; display: block; border-radius: 6px; }
  .cert-info { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>

  <nav class="nav">
    <a href="../index.html#top" class="mark" aria-label="Home">
      <span class="mark-ring"></span>
      <span class="mark-text">SR</span>
    </a>
  </nav>

  <div class="cert-page">
    <a class="back-link" href="../index.html#certificates">&larr; Back to certificates</a>

    <div class="cert-info">
      <span class="seal">&#10003;</span>
      <h1 style="font-family: var(--display); font-size: 1.5rem; font-weight: 600;">Certificate Title</h1>
    </div>
    <p class="cert-meta" style="margin-bottom: 0;">Issuer &middot; Month Year</p>

    <div class="cert-frame">
      <!-- Replace src with the actual scanned certificate image, e.g. this-cert.jpg -->
      <img src="../assets/certs/placeholder.jpg" alt="Certificate scan">
    </div>

    <p style="color: var(--muted); font-size: 0.92rem;">
      Issued for completing [course / achievement name]. This page serves as the verifiable record for this certificate.
    </p>
  </div>

</body>
</html>
